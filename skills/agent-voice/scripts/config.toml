# ttsd 部署配置 —— 两轴可插拔（engine × device）
# 依据 report.md「实施蓝图」小节生成

[engine]
name = "moss"                # say（零安装兜底）| moss（质量档）
prompt_audio = "assets/audio/zh_6.wav"
number_normalize = true       # 数字转中文读法（12306→一万二千三百零六）   # 已选女声（候选: zh_1/3/4/6/10/11, en_2）   # 声音克隆参考音频（换声音=换这个文件）
voice = "Tingting"           # say 引擎的 zh_CN 声音
download_dir = "models"      # g2pW 数据目录所在位置
hf_endpoint = "https://hf-mirror.com"        # bert-base-chinese tokenizer 下载走镜像
samplerate = 48000
format = "LEI16@48000"

# 首帧流式合成（pn-arm-firstframe-001）：首句 AR 逐帧解码出块，首块出声 ~114ms 且与句长无关
# （整段模式 371-1860ms）。CER 闭环 n=3 无系统劣化；代价：首句总合成 +28%（不影响后续句流水线）。
# 回滚：设为 false 即回到整段模式。
streaming_first_audio = false

# ORT intra_op 线程数 —— 按平台隔离（各平台实测值互不覆盖，勿跨平台复用）
# 依据：线程最优值依赖 CPU 拓扑（Intel 均匀核 vs Apple P/E 异构核）
[engine.threads]
default = 4        # 未识别平台的保守回退
x86_64 = 4         # Intel MBP 实测（perf-20260922，ORT 1.23.2，156/156 bit-exact）
arm64 = 4          # M4 Pro 实测（pn-arm-threads-001，ORT 1.30.0）：t=4 RTF 中位 0.2142 为最优；
                   # t=1 +31.6%、t=12 +22.7%（E 核调度，CV 0.283）均显著劣化；全配置 bit-exact

[device]
name = "BlackHole 2ch"       # auto 探测顺序: BlackHole -> PipeWire loopback -> VB-Cable
samplerate = 48000
blocksize = 256              # 实测锚点: 256 帧 ≈ 15.75ms 缓冲延迟（输出路径）
latency = "low"              # 必须显式 low；默认提示为 high

[service]
transport = "stdin"          # 部署自测用 stdin；常驻服务可换 uds/http
queue_maxsize = 4            # 有界队列，put 阻塞形成自然背压

[monitor]
enabled = true               # true = 播放进 BlackHole 的同时在本地扬声器/耳机同播（人工确认用）
name = "auto"                # auto = 系统默认输出设备；也可填具体设备名如 "外置耳机"

[safety]
output_clamp_dbfs = -6       # 输出钳制，防回环自激
feedback_rms_threshold = 0.98
feedback_sustain_ms = 250
